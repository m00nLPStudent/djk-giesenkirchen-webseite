name: Deploy to Hetzner preproduction

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: hetzner-preproduction-master
  cancel-in-progress: false

jobs:
  build-on-hetzner:
    name: Build pushed master commit on Hetzner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure verified SSH access
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.HETZNER_SSH_HOST_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077

          : "${SSH_HOST:?HETZNER_SSH_HOST is required}"
          : "${SSH_PORT:?HETZNER_SSH_PORT is required}"
          : "${SSH_USER:?HETZNER_SSH_USER is required}"
          : "${SSH_PRIVATE_KEY:?HETZNER_SSH_PRIVATE_KEY is required}"
          : "${SSH_HOST_KEY:?HETZNER_SSH_HOST_KEY is required}"

          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Invalid SSH host" >&2; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "Invalid SSH port" >&2; exit 1; }
          [[ "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid SSH user" >&2; exit 1; }

          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/hetzner_deploy_key"
          printf '%s\n' "$SSH_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hetzner_deploy_key" "$HOME/.ssh/known_hosts"

          ssh-keygen -y -f "$HOME/.ssh/hetzner_deploy_key" >/dev/null
          ssh-keygen -F "[$SSH_HOST]:$SSH_PORT" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Build exact commit on Hetzner
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.HETZNER_DEPLOY_PATH }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_PATH:?HETZNER_DEPLOY_PATH is required}"

          deploy_path_base64="$(printf '%s' "$DEPLOY_PATH" | base64 -w 0)"

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/hetzner_deploy_key" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH_BASE64=$deploy_path_base64 bash -s -- $EXPECTED_COMMIT" \
            < scripts/deploy-hetzner.sh

      - name: Manual restart reminder
        if: success()
        run: |
          echo "BUILD ERFOLGREICH"
          echo "MANUELLER NODE.JS-NEUSTART IN KONSOLEH ERFORDERLICH"
